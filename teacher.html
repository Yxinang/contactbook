<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 強制破除手機瀏覽器快取 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>班級 - 教師管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #E6F4F1; font-family: system-ui, -apple-system, sans-serif; color: #2F4F4F; -webkit-tap-highlight-color: transparent; }
        .soft-card { background-color: #FFFFFF; border: 2px solid #A3D2CA; border-radius: 20px; box-shadow: 0 4px 12px rgba(47, 79, 79, 0.05); }
        button, select, input { min-height: 44px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- 老師登入視窗 -->
    <div id="teacher-login-modal" class="fixed inset-0 bg-[#2F4F4F]/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="soft-card w-full max-w-sm p-5 space-y-4">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-[#C8E6C9] text-[#2F4F4F] rounded-2xl flex items-center justify-center mx-auto text-xl shadow-inner">
                    <i class="fa-solid fa-shield-cat"></i>
                </div>
                <h2 class="text-lg font-bold text-[#2F4F4F]">教師溫馨後台</h2>
                <p class="text-xs text-[#598379]">請輸入教師專屬帳號與密碼</p>
            </div>

            <div class="space-y-3 text-sm">
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1 text-xs">教師帳號</label>
                    <input type="text" id="teacher-user" class="w-full px-4 py-3 rounded-xl border-2 border-[#A3D2CA] bg-[#F0F7F6] outline-none focus:ring-2 focus:ring-[#598379] font-medium text-sm" placeholder="請輸入帳號">
                </div>
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1 text-xs">登入密碼</label>
                    <input type="password" id="teacher-pass" class="w-full px-4 py-3 rounded-xl border-2 border-[#A3D2CA] bg-[#F0F7F6] outline-none focus:ring-2 focus:ring-[#598379] font-medium text-sm" placeholder="請輸入密碼">
                </div>
                <div class="flex items-center pt-1">
                    <input type="checkbox" id="remember-me" class="w-5 h-5 text-[#598379] rounded border-[#A3D2CA] min-h-0">
                    <label for="remember-me" class="ml-2 text-[#2F4F4F] font-bold text-xs">記住我 (帳號與密碼)</label>
                </div>
                <button onclick="directLogin()" class="w-full bg-[#598379] hover:bg-[#4A6B63] text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm active:scale-95">
                    立即登入後台 💛
                </button>
            </div>
            <div class="text-center pt-2">
                <a href="index.html" class="text-xs text-[#598379] hover:underline font-bold">返回家長端首頁</a>
            </div>
        </div>
    </div>

    <!-- 教師後台主介面 -->
    <div id="teacher-dashboard" class="hidden flex flex-col min-h-screen">
        <header class="bg-[#598379] text-white shadow-sm sticky top-0 z-40">
            <div class="max-w-xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-white/80 p-2 rounded-2xl text-[#2F4F4F] shadow-sm">
                        <i class="fa-solid fa-chalkboard-user text-base"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm" id="teacher-header-title">班級 • 教師溫馨後台</h1>
                        <p class="text-[11px] text-[#E6F4F1]">手機直覺卡片式管理系統</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="logoutTeacher()" class="text-xs bg-[#C8E6C9] hover:bg-[#A5D6A7] text-[#2F4F4F] px-3 py-1.5 rounded-xl font-bold transition shadow-sm active:scale-95">
                        登出
                    </button>
                </div>
            </div>
            <!-- 雲端同步狀態橫幅 -->
            <div class="bg-[#4A6B63] text-[#E6F4F1] text-[11px] px-4 py-1.5 flex justify-between items-center border-t border-white/10">
                <span id="teacher-sync-status"><i class="fa-solid fa-circle-check text-[#C8E6C9] mr-1"></i> 已連線至雲端</span>
                <button onclick="manualSyncTeacher()" class="min-h-0 py-0.5 px-2.5 bg-white/20 hover:bg-white/30 rounded-lg text-[11px] font-bold transition active:scale-95">
                    <i class="fa-solid fa-arrows-rotate mr-1"></i>重新讀取雲端
                </button>
            </div>
        </header>

        <main class="max-w-xl mx-auto px-3 py-4 flex-grow w-full space-y-4">
            <div class="flex bg-[#D8E8E5] p-1.5 rounded-xl border-2 border-[#A3D2CA] text-xs">
                <button onclick="switchTab('homework')" id="tab-homework" class="flex-1 py-2 font-bold rounded-lg bg-white text-[#2F4F4F] shadow-sm transition active:scale-95">作業狀態</button>
                <button onclick="switchTab('note')" id="tab-note" class="flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95">聯絡簿管理</button>
                <button onclick="switchTab('injury')" id="tab-injury" class="flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95">傷病通知</button>
                <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95"><i class="fa-solid fa-gear mr-1"></i>設定</button>
            </div>

            <!-- 1. 作業狀態管理（卡片式清單設計） -->
            <div id="section-homework" class="space-y-4">
                <div class="soft-card p-4 flex justify-between items-center gap-2 bg-[#F0F7F6]">
                    <div>
                        <h2 class="font-bold text-[#2F4F4F] text-xs flex items-center gap-1.5">
                            <i class="fa-solid fa-list-check text-[#598379]"></i> 登記昨天作業繳交狀態
                        </h2>
                        <p class="text-[11px] text-[#598379] mt-0.5 font-bold" id="hw-current-date-tag">載入中...</p>
                    </div>
                    <div class="shrink-0">
                        <button onclick="setAllGlobalStatus('1')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-sm transition active:scale-95">
                            全班皆已繳交
                        </button>
                    </div>
                </div>

                <!-- 學生卡片清單容器 -->
                <div id="teacher-homework-cards-container" class="space-y-3"></div>
            </div>

            <!-- 2. 聯絡簿內容與管理（含年月日小日曆） -->
            <div id="section-note" class="soft-card p-4 space-y-4 hidden">
                <div class="space-y-3 bg-[#F0F7F6] p-4 rounded-xl border border-[#A3D2CA]">
                    <div class="flex justify-between items-center border-b border-[#A3D2CA] pb-2">
                        <h2 class="font-bold text-[#2F4F4F] text-xs"><i class="fa-solid fa-book text-[#598379] mr-1"></i>發布與預排聯絡簿</h2>
                        <button onclick="prepareNewNote()" class="bg-[#598379] hover:bg-[#4A6B63] text-white px-3 py-2 rounded-lg text-xs font-bold shadow-sm transition active:scale-95">
                            <i class="fa-solid fa-plus mr-1"></i> 重設為今天
                        </button>
                    </div>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">📅 點選聯絡簿日期（年月日小日曆）</label>
                            <input type="date" id="note-date-picker" onchange="syncDatePreview()" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-[#A3D2CA] bg-white font-bold text-sm text-[#2F4F4F]">
                            <p class="text-[11px] text-[#598379] font-bold mt-1 pl-1" id="note-date-preview">顯示格式：載入中...</p>
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">聯絡簿抄寫內容（每行一項作業）</label>
                            <textarea id="note-content" rows="4" placeholder="例如：&#10;1. 國文習作第 5 課&#10;2. 數學練習卷一張" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium text-sm"></textarea>
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">📢 老師提醒 / 給家長的話</label>
                            <textarea id="note-parent-message" rows="2" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium text-sm"></textarea>
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">叮嚀備註</label>
                            <input type="text" id="note-reminder" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium text-sm">
                        </div>
                        <button onclick="saveContactNote()" class="w-full bg-[#598379] hover:bg-[#4A6B63] text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm active:scale-95">儲存並設為家長端當前顯示 💛</button>
                    </div>
                </div>

                <div class="space-y-3 border-t border-[#A3D2CA] pt-3">
                    <h3 class="font-bold text-[#2F4F4F] text-xs"><i class="fa-solid fa-box-archive text-[#598379] mr-1"></i>歷史與預排聯絡簿總覽（點「設為當前」可切換家長首頁）</h3>
                    <div class="space-y-2.5 max-h-80 overflow-y-auto pr-1 text-xs" id="teacher-history-notes-list"></div>
                </div>
            </div>

            <!-- 3. 傷病通知發送與狀態查詢 -->
            <div id="section-injury" class="soft-card p-4 space-y-4 hidden">
                <div>
                    <h2 class="font-bold text-[#2F4F4F] text-xs border-b border-[#A3D2CA] pb-2"><i class="fa-solid fa-user-nurse text-rose-500 mr-1"></i>發送傷病通知單</h2>
                    <form onsubmit="submitInjuryNotice(event)" class="space-y-3 text-xs mt-2">
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">選擇學生</label>
                            <select id="inj-student-id" required class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-[#F0F7F6] font-medium text-sm"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-bold text-[#2F4F4F] mb-1">發生時間</label>
                                <input type="text" id="inj-time" required value="上午 10:15" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium text-sm">
                            </div>
                            <div>
                                <label class="block font-bold text-[#2F4F4F] mb-1">處理人員</label>
                                <select id="inj-nurse" required class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium text-sm">
                                    <option value="保健室">選項一：保健室</option>
                                    <option value="教室觀察">選項二：教室觀察</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">發生地點</label>
                            <input type="text" id="inj-location" required value="下課遊樂場" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium text-sm">
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">受傷症狀</label>
                            <input type="text" id="inj-symptom" required value="右膝擦傷" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium text-sm">
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">處理經過</label>
                            <textarea id="inj-treatment" rows="2" required class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium text-sm">生理食鹽水清洗，擦優碘貼人工皮。</textarea>
                        </div>
                        <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm active:scale-95">發送傷病通知單 🩹</button>
                    </form>
                </div>

                <div class="border-t border-[#A3D2CA] pt-3">
                    <h3 class="font-bold text-[#2F4F4F] text-xs mb-2.5"><i class="fa-solid fa-clipboard-list text-rose-500 mr-1"></i>已發送之傷病通知</h3>
                    <div class="space-y-3 text-xs" id="teacher-injury-status-list"></div>
                </div>
            </div>

            <!-- 4. 班級與學生設定 -->
            <div id="section-settings" class="soft-card p-4 space-y-4 hidden">
                <h2 class="font-bold text-[#2F4F4F] text-xs border-b border-[#A3D2CA] pb-2"><i class="fa-solid fa-gear text-[#598379] mr-1"></i>班級與學生名單設定</h2>
                
                <div class="grid grid-cols-3 gap-2 text-xs bg-[#F0F7F6] p-3 rounded-xl border border-[#A3D2CA]">
                    <div>
                        <label class="block font-bold text-[#2F4F4F] mb-1">學校</label>
                        <input type="text" id="setting-school" class="w-full px-3 py-2 rounded-xl border border-[#A3D2CA] bg-white font-medium text-xs">
                    </div>
                    <div>
                        <label class="block font-bold text-[#2F4F4F] mb-1">班級</label>
                        <input type="text" id="setting-classname" class="w-full px-3 py-2 rounded-xl border border-[#A3D2CA] bg-white font-medium text-xs">
                    </div>
                    <div>
                        <label class="block font-bold text-[#2F4F4F] mb-1">老師</label>
                        <input type="text" id="setting-teacher" class="w-full px-3 py-2 rounded-xl border border-[#A3D2CA] bg-white font-medium text-xs">
                    </div>
                </div>

                <div class="bg-[#E0F2F1] p-3 rounded-xl border border-[#A3D2CA] space-y-2 text-xs">
                    <h3 class="font-bold text-[#2F4F4F]"><i class="fa-solid fa-user-plus mr-1"></i> 新增或修改學生</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <input type="text" id="new-seat" placeholder="座號" class="px-3 py-2.5 rounded-xl border border-[#A3D2CA] bg-white font-medium text-xs">
                        <input type="text" id="new-name" placeholder="學生姓名" class="px-3 py-2.5 rounded-xl border border-[#A3D2CA] bg-white font-medium text-xs">
                        <input type="text" id="new-id" placeholder="學號" class="px-3 py-2.5 rounded-xl border border-[#A3D2CA] bg-white font-medium text-xs">
                    </div>
                    <button onclick="addNewStudent()" class="w-full bg-[#598379] hover:bg-[#4A6B63] text-white font-bold py-2.5 rounded-xl shadow-sm transition text-xs active:scale-95">新增/更新學生</button>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-[#2F4F4F] text-xs"><i class="fa-solid fa-users mr-1"></i> 現有學生清單</h3>
                        <button onclick="saveClassSettings()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3.5 py-2 rounded-xl text-xs shadow-sm transition active:scale-95">
                            <i class="fa-solid fa-floppy-disk mr-1"></i> 儲存設定
                        </button>
                    </div>
                    <div class="overflow-x-auto max-h-60 border border-[#A3D2CA] rounded-xl">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-[#F0F7F6] text-[#2F4F4F] border-b border-[#A3D2CA] sticky top-0 font-bold">
                                    <th class="p-3">座號</th>
                                    <th class="p-3">姓名</th>
                                    <th class="p-3">學號</th>
                                    <th class="p-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="settings-student-tbody" class="divide-y divide-[#E0F2F1]"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 修改傷病通知彈跳視窗 -->
    <div id="injury-edit-modal" class="fixed inset-0 bg-[#2F4F4F]/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="soft-card w-full max-w-md p-5 space-y-3 text-xs">
            <div class="flex justify-between items-center border-b border-[#A3D2CA] pb-2">
                <h3 class="font-bold text-sm text-[#2F4F4F]"><i class="fa-solid fa-pen-to-square text-rose-500 mr-1"></i> 修改傷病通知單</h3>
                <button onclick="closeInjuryEditModal()" class="text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <input type="hidden" id="edit-inj-student-id">
            <input type="hidden" id="edit-inj-index">
            <div class="space-y-3 text-sm">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-[#2F4F4F] mb-1 text-xs">發生時間</label>
                        <input type="text" id="edit-inj-time" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] font-medium text-xs">
                    </div>
                    <div>
                        <label class="block font-bold text-[#2F4F4F] mb-1 text-xs">處理人員</label>
                        <select id="edit-inj-nurse" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium text-xs">
                            <option value="保健室">選項一：保健室</option>
                            <option value="教室觀察">選項二：教室觀察</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1 text-xs">發生地點</label>
                    <input type="text" id="edit-inj-location" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] font-medium text-xs">
                </div>
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1 text-xs">受傷症狀</label>
                    <input type="text" id="edit-inj-symptom" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] font-medium text-xs">
                </div>
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1 text-xs">處理經過</label>
                    <textarea id="edit-inj-treatment" rows="2" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] font-medium text-xs"></textarea>
                </div>
                <button onclick="saveInjuryEdit()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-xl shadow-sm transition text-sm active:scale-95">確認修改儲存</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_BIN_URL = 'https://api.jsonbin.io/v3/b/65f6c82d3dcbb1b7cc342831';
        const MASTER_KEY = '$2a$10$95bW31HqL48Jb8Q5Vf3d1eK7n9bW31HqL48Jb8Q5Vf3d1eK7n9bW3';
        const FIXED_TEACHER_USER = "t309";
        const FIXED_TEACHER_PASS = "0909";

        window.onload = async function() {
            initTodayDatePicker();
            await syncLoadData();
            const savedUser = localStorage.getItem('ncm309_remembered_user');
            const savedPass = localStorage.getItem('ncm309_remembered_pass');
            if (savedUser && savedPass) {
                document.getElementById('teacher-user').value = savedUser;
                document.getElementById('teacher-pass').value = savedPass;
                document.getElementById('remember-me').checked = true;
            }

            const isTeacherLogged = sessionStorage.getItem('ncm309_teacher_logged');
            if (isTeacherLogged === 'true') {
                document.getElementById('teacher-login-modal').classList.add('hidden');
                document.getElementById('teacher-dashboard').classList.remove('hidden');
                loadTeacherData();
            }
        };

        function initTodayDatePicker() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const picker = document.getElementById('note-date-picker');
            if (picker) {
                picker.value = `${yyyy}-${mm}-${dd}`;
                syncDatePreview();
            }
        }

        function formatPickerDateToROC(isoDateStr) {
            if (!isoDateStr) return getTaiwanTaipeiDateString();
            const parts = isoDateStr.split('-');
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);
            const dateObj = new Date(year, month - 1, day);
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const rocYear = year - 1911;
            return `民國 ${rocYear} 年 ${month} 月 ${day} 日 (${weekdays[dateObj.getDay()]})`;
        }

        function syncDatePreview() {
            const picker = document.getElementById('note-date-picker');
            const preview = document.getElementById('note-date-preview');
            if (picker && preview) {
                preview.innerText = `家長端顯示日期：${formatPickerDateToROC(picker.value)}`;
            }
        }

        async function manualSyncTeacher() {
            const statusEl = document.getElementById('teacher-sync-status');
            if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-rotate fa-spin mr-1"></i> 正在讀取雲端最新資料...`;
            await syncLoadData();
            loadTeacherData();
        }

        async function syncLoadData() {
            try {
                const response = await fetch(`${CLOUD_BIN_URL}/latest?_t=${Date.now()}`, {
                    cache: 'no-store',
                    headers: {
                        'X-Master-Key': MASTER_KEY,
                        'Cache-Control': 'no-cache'
                    }
                });
                if (response.ok) {
                    const cloudResult = await response.json();
                    // 保護機制：確認雲端回傳結構完整才寫入本機，防止覆蓋原有設定
                    if (cloudResult && cloudResult.record && cloudResult.record.students) {
                        localStorage.setItem('ncm309_school_data', JSON.stringify(cloudResult.record));
                        const nowStr = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                        const statusEl = document.getElementById('teacher-sync-status');
                        if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-circle-check text-[#C8E6C9] mr-1"></i> 已與雲端同步 (${nowStr})`;
                        return true;
                    }
                }
            } catch (e) {
                const statusEl = document.getElementById('teacher-sync-status');
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-300 mr-1"></i> 離線模式（顯示本機資料）`;
            }
            return false;
        }

        function sortNotesByDate(notesList) {
            notesList.sort((a, b) => parseDateStringForSorting(b.date) - parseDateStringForSorting(a.date));
        }

        function parseDateStringForSorting(dateStr) {
            if (!dateStr) return 0;
            const match = dateStr.match(/(?:民國\s*(\d+)\s*年)?\s*(\d+)\s*月\s*(\d+)\s*日/);
            if (match) {
                let year = match[1] ? parseInt(match[1]) + 1911 : new Date().getFullYear();
                let month = parseInt(match[2]) - 1;
                let day = parseInt(match[3]);
                return new Date(year, month, day).getTime();
            }
            return new Date(dateStr).getTime() || 0;
        }

        async function saveSystemData(data) {
            const statusEl = document.getElementById('teacher-sync-status');
            if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-rotate fa-spin mr-1"></i> 正在儲存至雲端...`;

            if (data.notesList && Array.isArray(data.notesList)) {
                sortNotesByDate(data.notesList);
            }
            localStorage.setItem('ncm309_school_data', JSON.stringify(data));
            try {
                const res = await fetch(CLOUD_BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    const nowStr = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                    if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-[#C8E6C9] mr-1"></i> 已成功儲存至雲端 (${nowStr})`;
                } else {
                    if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-300 mr-1"></i> 雲端寫入異常，請稍後再試`;
                }
            } catch (e) {
                if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-300 mr-1"></i> 網路連線不穩，已暫存於手機`;
            }
        }

        function getSystemData() {
            let data = localStorage.getItem('ncm309_school_data');
            const freshData = generateDefaultData();

            if (!data) {
                return freshData;
            }

            try {
                let parsed = JSON.parse(data);
                if (!parsed.classInfo) parsed.classInfo = freshData.classInfo;
                if (!parsed.notesList || parsed.notesList.length === 0) {
                    parsed.notesList = freshData.notesList;
                } else {
                    sortNotesByDate(parsed.notesList);
                }
                if (!parsed.activeNoteId && parsed.notesList.length > 0) {
                    parsed.activeNoteId = parsed.notesList[0].id;
                }
                // 保留您原有的學生名單，只有完全沒有學生資料時才使用預設值
                if (!parsed.students || Object.keys(parsed.students).length === 0) {
                    parsed.students = freshData.students;
                }
                return parsed;
            } catch (e) {
                return freshData;
            }
        }

        function getTaiwanTaipeiDateString() {
            const now = new Date();
            const options = { timeZone: 'Asia/Taipei', year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'long' };
            const formatter = new Intl.DateTimeFormat('zh-TW', options);
            const parts = formatter.formatToParts(now);
            
            let year = '', month = '', day = '', weekday = '';
            parts.forEach(part => {
                if (part.type === 'year') year = parseInt(part.value) - 1911;
                if (part.type === 'month') month = part.value;
                if (part.type === 'day') day = part.value;
                if (part.type === 'weekday') weekday = part.value;
            });
            return `民國 ${year} 年 ${month} 月 ${day} 日 (${weekday})`;
        }

        async function setAllStatusForStudent(studentId, noteId, totalHwCount, targetStatus) {
            if (totalHwCount === 0) {
                alert("目前沒有作業項目可供設定！");
                return;
            }
            const systemData = getSystemData();
            if (!systemData.students[studentId].homeworkStatus) systemData.students[studentId].homeworkStatus = {};
            if (!systemData.students[studentId].homeworkStatus[noteId]) systemData.students[studentId].homeworkStatus[noteId] = {};

            for (let i = 0; i < totalHwCount; i++) {
                systemData.students[studentId].homeworkStatus[noteId][i] = targetStatus;
            }

            await saveSystemData(systemData);
            loadTeacherData();
        }

        async function setAllGlobalStatus(targetStatus) {
            const systemData = getSystemData();
            sortNotesByDate(systemData.notesList);
            let activeNote = systemData.notesList.find(n => n.id === systemData.activeNoteId) || systemData.notesList[0] || null;
            let activeNoteIndex = systemData.notesList.findIndex(n => n.id === (activeNote ? activeNote.id : ''));
            let yesterdayNote = (activeNoteIndex !== -1 && systemData.notesList[activeNoteIndex + 1]) ? systemData.notesList[activeNoteIndex + 1] : activeNote;

            if (!yesterdayNote) return;
            const hwLines = yesterdayNote.content ? yesterdayNote.content.split('\n').filter(line => line.trim() !== '') : [];
            if (hwLines.length === 0) return;

            Object.keys(systemData.students).forEach(id => {
                if (!systemData.students[id].homeworkStatus) systemData.students[id].homeworkStatus = {};
                if (!systemData.students[id].homeworkStatus[yesterdayNote.id]) systemData.students[id].homeworkStatus[yesterdayNote.id] = {};
                hwLines.forEach((_, index) => {
                    systemData.students[id].homeworkStatus[yesterdayNote.id][index] = targetStatus;
                });
            });

            await saveSystemData(systemData);
            loadTeacherData();
            alert("已將全班作業狀態設定為全部繳交！");
        }

            const updatedNoteData = {
                id: newId,
                date: formattedDate,
                content: contentVal,
                parentMessage: document.getElementById('note-parent-message').value,
                reminder: document.getElementById('note-reminder').value
            };

            systemData.notesList.unshift(updatedNoteData);
            systemData.activeNoteId = newId;
            
            await saveSystemData(systemData);
            alert(`聯絡簿（${formattedDate}）已成功發布並設為當前顯示！`);
            loadTeacherData();
        }

        async function addNewStudent() {
            const seat = document.getElementById('new-seat').value.trim();
            const name = document.getElementById('new-name').value.trim();
            const id = document.getElementById('new-id').value.trim();

            if (!seat || !name || !id) {
                alert("請完整填寫座號、學生姓名與學號！");
                return;
            }

            const systemData = getSystemData();
            systemData.students[id] = { name: name, seat: seat, homeworkStatus: {}, parentAssist: "", injuries: [] };

            await saveSystemData(systemData);
            alert(`已成功新增/更新學生：${seat} 號 ${name}！`);
            document.getElementById('new-seat').value = '';
            document.getElementById('new-name').value = '';
            document.getElementById('new-id').value = '';
            loadTeacherData();
        }

        async function deleteStudent(id) {
            if (confirm("確定要刪除這位學生嗎？")) {
                const systemData = getSystemData();
                delete systemData.students[id];
                await saveSystemData(systemData);
                loadTeacherData();
            }
        }

        async function saveClassSettings() {
            const systemData = getSystemData();
            systemData.classInfo = {
                schoolName: document.getElementById('setting-school').value.trim(),
                className: document.getElementById('setting-classname').value.trim(),
                teacherName: document.getElementById('setting-teacher').value.trim()
            };
            await saveSystemData(systemData);
            alert("班級基本設定已成功儲存！");
            loadTeacherData();
        }

        async function submitInjuryNotice(event) {
            event.preventDefault();
            const studentId = document.getElementById('inj-student-id').value;
            const newInjury = {
                date: getTaiwanTaipeiDateString(),
                time: document.getElementById('inj-time').value,
                nurse: document.getElementById('inj-nurse').value,
                location: document.getElementById('inj-location').value,
                symptom: document.getElementById('inj-symptom').value,
                treatment: document.getElementById('inj-treatment').value,
                confirmed: false,
                confirmTime: null
            };

            const systemData = getSystemData();
            if (!systemData.students[studentId].injuries) systemData.students[studentId].injuries = [];
            systemData.students[studentId].injuries.unshift(newInjury);
            await saveSystemData(systemData);
            alert("傷病通知單已成功發送！");
            loadTeacherData();
        }

        function switchTab(tab) {
            document.getElementById('tab-homework').className = tab === 'homework' ? "flex-1 py-2 font-bold rounded-lg bg-white text-[#2F4F4F] shadow-sm transition active:scale-95" : "flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95";
            document.getElementById('tab-note').className = tab === 'note' ? "flex-1 py-2 font-bold rounded-lg bg-white text-[#2F4F4F] shadow-sm transition active:scale-95" : "flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95";
            document.getElementById('tab-injury').className = tab === 'injury' ? "flex-1 py-2 font-bold rounded-lg bg-white text-[#2F4F4F] shadow-sm transition active:scale-95" : "flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95";
            document.getElementById('tab-settings').className = tab === 'settings' ? "flex-1 py-2 font-bold rounded-lg bg-white text-[#2F4F4F] shadow-sm transition active:scale-95" : "flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95";

            document.getElementById('section-homework').classList.toggle('hidden', tab !== 'homework');
            document.getElementById('section-note').classList.toggle('hidden', tab !== 'note');
            document.getElementById('section-injury').classList.toggle('hidden', tab !== 'injury');
            document.getElementById('section-settings').classList.toggle('hidden', tab !== 'settings');
        }
    </script>
</body>
</html>
