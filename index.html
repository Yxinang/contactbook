<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 強制破除 LINE 與手機瀏覽器網頁快取 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>班級 - 家長即時守護系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #E6F4F1; font-family: system-ui, -apple-system, sans-serif; color: #2F4F4F; -webkit-tap-highlight-color: transparent; }
        .soft-card { background-color: #FFFFFF; border: 2px solid #A3D2CA; border-radius: 20px; box-shadow: 0 4px 12px rgba(47, 79, 79, 0.05); }
        .soft-header { background-color: #F0F7F6; border-bottom: 2px solid #A3D2CA; border-top-left-radius: 18px; border-top-right-radius: 18px; }
        button, input { min-height: 44px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header id="app-header" class="bg-[#598379] text-white shadow-sm sticky top-0 z-50 hidden">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/80 p-2 rounded-2xl text-[#2F4F4F] shadow-sm">
                    <i class="fa-solid fa-fish-fins text-base"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm" id="header-child-name">載入中...</h1>
                    <p class="text-[11px] text-[#E6F4F1]" id="header-className-display">班級載入中...</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs text-[#2F4F4F] bg-[#C8E6C9] hover:bg-[#A5D6A7] px-3 py-1.5 rounded-xl transition flex items-center gap-1 font-bold shadow-sm active:scale-95">
                <i class="fa-solid fa-right-from-bracket"></i> 登出
            </button>
        </div>
        <!-- 即時同步狀態橫幅 -->
        <div class="bg-[#4A6B63] text-[#E6F4F1] text-[11px] px-4 py-1.5 flex justify-between items-center border-t border-white/10">
            <span id="sync-status-text"><i class="fa-solid fa-rotate fa-spin mr-1"></i> 正在向雲端取得最新消息...</span>
            <button onclick="manualRefresh()" class="min-h-0 py-0.5 px-2.5 bg-white/20 hover:bg-white/30 rounded-lg text-[11px] font-bold transition active:scale-95">
                <i class="fa-solid fa-arrows-rotate mr-1"></i>立即更新
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3 py-4 flex-grow w-full space-y-4">

        <!-- 登入畫面 -->
        <section id="login-section" class="soft-card p-5 space-y-4 my-auto">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-[#C8E6C9] text-[#2F4F4F] rounded-2xl flex items-center justify-center mx-auto text-xl shadow-inner">
                    <i class="fa-solid fa-whale"></i>
                </div>
                <h2 class="text-lg font-bold text-[#2F4F4F]" id="login-title-display">親師生溫馨聯絡平台</h2>
                <p class="text-xs text-[#598379]" id="login-sync-hint">正在連線雲端確認最新班級資料...</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1 text-xs">學生學號</label>
                    <input type="text" id="login-student-id" required placeholder="請輸入學生學號" class="w-full px-4 py-3 rounded-xl border-2 border-[#A3D2CA] bg-[#F0F7F6] text-sm focus:ring-2 focus:ring-[#598379] outline-none font-medium">
                </div>
                <div class="flex items-center pt-1">
                    <input type="checkbox" id="parent-remember-me" class="w-5 h-5 text-[#598379] rounded border-[#A3D2CA] min-h-0">
                    <label for="parent-remember-me" class="ml-2 text-[#2F4F4F] font-bold text-xs">記住我 (下次自動登入)</label>
                </div>
                <button type="submit" id="login-submit-btn" class="w-full bg-[#598379] hover:bg-[#4A6B63] text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm active:scale-95">
                    進入專屬小天地 🧸
                </button>
            </form>

            <div class="pt-3 border-t border-[#A3D2CA] flex justify-between items-center text-xs text-[#598379]">
                <span id="login-footer-school">崇明國小</span>
                <a href="teacher.html" class="text-[#598379] hover:underline font-bold"><i class="fa-solid fa-lock mr-1"></i>教師後台</a>
            </div>
        </section>

        <!-- 儀表板主畫面 -->
        <div id="dashboard-section" class="hidden space-y-4">
            <div class="flex bg-[#D8E8E5] p-1.5 rounded-xl border-2 border-[#A3D2CA] text-xs">
                <button onclick="switchTab('today')" id="tab-today" class="flex-1 py-2 font-bold rounded-lg bg-white text-[#2F4F4F] shadow-sm transition active:scale-95">
                    今日聯絡簿
                </button>
                <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95">
                    歷史紀錄
                </button>
                <button onclick="switchTab('injury')" id="tab-injury" class="flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95">
                    傷病通知
                </button>
            </div>

            <!-- 第一頁：今日聯絡簿與昨天作業繳交狀態 -->
            <div id="view-today" class="space-y-4">
                
                <!-- 當天聯絡簿內容與老師提醒 -->
                <section class="soft-card p-4 space-y-3">
                    <div class="soft-header px-3.5 py-2.5 flex justify-between items-center -mx-4 -mt-4 mb-2">
                        <h2 class="font-bold text-[#2F4F4F] text-xs flex items-center gap-1.5">
                            <i class="fa-solid fa-star text-amber-600"></i> 當天聯絡簿內容
                        </h2>
                        <span class="text-[11px] text-[#2F4F4F] font-bold bg-[#C8E6C9] px-3 py-0.5 rounded-full shadow-sm" id="note-display-date">載入中...</span>
                    </div>
                    <div class="bg-[#F0F7F6] p-3.5 rounded-xl border border-[#A3D2CA]">
                        <p class="text-sm text-[#2F4F4F] whitespace-pre-line font-medium leading-relaxed" id="note-display-content">載入中...</p>
                    </div>
                    
                    <div class="bg-[#FFF8E1] p-3.5 rounded-xl border border-[#FFE082] space-y-1">
                        <p class="text-[11px] font-bold text-[#8D6E63] flex items-center gap-1" id="note-teacher-label">
                            <i class="fa-solid fa-heart text-rose-500"></i> 老師提醒 / 給家長的話：
                        </p>
                        <p class="text-sm text-[#3E2723] font-medium leading-relaxed pl-3" id="note-display-message">尚無留言</p>
                    </div>

                    <div class="flex items-center gap-2 text-xs text-[#2F4F4F] bg-[#E0F2F1] p-3.5 rounded-xl border border-[#B2DFDB]">
                        <i class="fa-solid fa-bell text-[#00897B] text-sm"></i>
                        <p class="text-xs"><span class="font-bold">叮嚀備註：</span><span id="note-display-reminder">載入中...</span></p>
                    </div>
                </section>

                <!-- 昨天作業今天繳交狀態核對 -->
                <section class="soft-card p-4 space-y-3">
                    <div class="border-b border-[#A3D2CA] pb-2 flex flex-col gap-0.5">
                        <h2 class="font-bold text-[#2F4F4F] text-xs flex items-center gap-1.5">
                            <i class="fa-solid fa-list-check text-[#598379]"></i> 昨天作業今天繳交狀態
                        </h2>
                        <span class="text-[11px] text-[#598379] font-bold" id="yesterday-date-label">對應昨日聯絡簿</span>
                    </div>
                    <div class="space-y-2 text-xs" id="yesterday-homework-list">
                        <p class="text-slate-400 text-center py-2">昨日無登記作業狀態</p>
                    </div>
                </section>

                <!-- 需家長協助完成之作業 -->
                <section class="soft-card p-4 space-y-3 bg-[#FFF9C4]/30 border-[#FFE082]">
                    <h2 class="font-bold text-[#5D4037] text-xs flex items-center gap-1.5 border-b border-[#FFE082] pb-2">
                        <i class="fa-solid fa-hands-holding-child text-amber-600"></i> 需家長協助完成之作業 / 個別事項
                    </h2>
                    <div class="bg-white p-3.5 rounded-xl border border-[#FFE082] text-xs space-y-1" id="parent-assist-homework-list">
                        <p class="text-slate-500 text-center py-1">目前無特別需家長協助之項目 ✨</p>
                    </div>
                </section>

            </div>

            <!-- 第二頁：歷史點滴紀錄 -->
            <div id="view-history" class="space-y-4 hidden">
                <section class="soft-card p-4 space-y-3">
                    <h2 class="font-bold text-[#2F4F4F] text-xs flex items-center gap-1.5 border-b border-[#A3D2CA] pb-2">
                        <i class="fa-solid fa-box-archive text-[#598379]"></i> 歷史聯絡簿完整總覽
                    </h2>
                    <div class="space-y-2.5 max-h-96 overflow-y-auto pr-1 text-xs" id="all-history-notes-container"></div>
                </section>
            </div>

            <!-- 第三頁：傷病通知紀錄 -->
            <div id="view-injury" class="space-y-4 hidden">
                <section class="soft-card p-4 space-y-3">
                    <h2 class="font-bold text-[#2F4F4F] text-xs flex items-center gap-1.5 border-b border-[#A3D2CA] pb-2">
                        <i class="fa-solid fa-clock text-[#598379]"></i> 老師上傳，等待確認（<span id="pending-injury-count">0</span> 筆）
                    </h2>
                    <div class="space-y-2.5 text-xs" id="pending-injury-list"></div>
                </section>

                <section class="soft-card p-4 space-y-3 border-[#A5D6A7]">
                    <h2 class="font-bold text-[#2E7D32] text-xs flex items-center gap-1.5 border-b border-[#C8E6C9] pb-2">
                        <i class="fa-solid fa-circle-check text-emerald-600"></i> 已確認收到紀錄（<span id="confirmed-injury-count">0</span> 筆）
                    </h2>
                    <div class="space-y-2.5 text-xs" id="confirmed-injury-list"></div>
                </section>
            </div>
        </div>
    </main>

    <footer class="py-3 text-center text-[11px] text-[#598379]">
        <p id="footer-school-name">崇明國小 • 溫馨守護每一刻 💛</p>
    </footer>

    <script>
        const CLOUD_BIN_URL = 'https://api.jsonbin.io/v3/b/65f6c82d3dcbb1b7cc342831';
        const MASTER_KEY = '$2a$10$95bW31HqL48Jb8Q5Vf3d1eK7n9bW31HqL48Jb8Q5Vf3d1eK7n9bW3';
        let currentStudentId = null;

        window.onload = async function() {
            // 雲端優先讀取，確保一打開就拿到最新資料
            await syncLoadData(true);
            const systemData = getSystemData();
            if (systemData.classInfo) {
                document.getElementById('login-title-display').innerText = `${systemData.classInfo.className} 溫馨平台`;
                document.getElementById('login-footer-school').innerText = systemData.classInfo.schoolName;
                document.getElementById('footer-school-name').innerText = `${systemData.classInfo.schoolName} • 溫馨守護每一刻 💛`;
            }

            const rememberedId = localStorage.getItem('ncm309_remembered_parent_id');
            if (rememberedId && systemData.students[rememberedId]) {
                document.getElementById('login-student-id').value = rememberedId;
                document.getElementById('parent-remember-me').checked = true;
                autoLoginParent(rememberedId, systemData);
            }

            // 只要家長從 LINE 或其他 App 切回網頁分頁，立刻強制同步最新消息
            document.addEventListener('visibilitychange', async () => {
                if (document.visibilityState === 'visible') {
                    await manualRefresh();
                }
            });

            // 每 5 秒背景靜默核對雲端最新資料
            setInterval(async () => {
                if (document.visibilityState === 'visible') {
                    await syncLoadData(false);
                    if (currentStudentId) {
                        const latestData = getSystemData();
                        if (latestData.students[currentStudentId]) {
                            renderDashboard(latestData.students[currentStudentId], latestData);
                        }
                    }
                }
            }, 5000);
        };

        async function manualRefresh() {
            const statusEl = document.getElementById('sync-status-text');
            if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-rotate fa-spin mr-1"></i> 正在同步最新資料...`;
            await syncLoadData(true);
            if (currentStudentId) {
                const latestData = getSystemData();
                if (latestData.students[currentStudentId]) {
                    renderDashboard(latestData.students[currentStudentId], latestData);
                }
            }
        }

        async function syncLoadData(updateBanner) {
            try {
                const response = await fetch(`${CLOUD_BIN_URL}/latest?_t=${Date.now()}`, {
                    cache: 'no-store',
                    headers: {
                        'X-Master-Key': MASTER_KEY,
                        'Cache-Control': 'no-cache'
                    }
                });
                if (response.ok) {
                    const cloudResult = await response.json();
                    if (cloudResult && cloudResult.record && cloudResult.record.students) {
                        // 僅在雲端有合法資料時才更新本機備份，絕不覆蓋掉雲端資料
                        localStorage.setItem('ncm309_school_data', JSON.stringify(cloudResult.record));
                        const nowStr = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                        const hintEl = document.getElementById('login-sync-hint');
                        if (hintEl) hintEl.innerText = `已連線至雲端最新資料 (${nowStr}) ✨`;
                        const statusEl = document.getElementById('sync-status-text');
                        if (statusEl) statusEl.innerHTML = `<i class="fa-solid fa-circle-check text-[#C8E6C9] mr-1"></i> 已同步至最新 (${nowStr})`;
                        return true;
                    }
                }
            } catch (e) {
                const statusEl = document.getElementById('sync-status-text');
                if (statusEl && updateBanner) statusEl.innerHTML = `<i class="fa-solid fa-wifi mr-1"></i> 離線模式（顯示本機備份）`;
            }
            return false;
        }

        function sortNotesByDate(notesList) {
            notesList.sort((a, b) => parseDateStringForSorting(b.date) - parseDateStringForSorting(a.date));
        }

        function parseDateStringForSorting(dateStr) {
            if (!dateStr) return 0;
            const match = dateStr.match(/(?:民國\s*(\d+)\s*年)?\s*(\d+)\s*月\s*(\d+)\s*日/);
            if (match) {
                let year = match[1] ? parseInt(match[1]) + 1911 : new Date().getFullYear();
                let month = parseInt(match[2]) - 1;
                let day = parseInt(match[3]);
                return new Date(year, month, day).getTime();
            }
            return new Date(dateStr).getTime() || 0;
        }

        function getSystemData() {
            let data = localStorage.getItem('ncm309_school_data');
            const freshData = generateDefaultData();

            if (!data) {
                return freshData;
            }

            try {
                let parsed = JSON.parse(data);
                if (!parsed.classInfo) parsed.classInfo = freshData.classInfo;
                if (!parsed.notesList || parsed.notesList.length === 0) {
                    parsed.notesList = freshData.notesList;
                } else {
                    sortNotesByDate(parsed.notesList);
                }
                if (!parsed.activeNoteId && parsed.notesList.length > 0) {
                    parsed.activeNoteId = parsed.notesList[0].id;
                }
                if (!parsed.students || Object.keys(parsed.students).length === 0) {
                    parsed.students = freshData.students;
                }
                return parsed;
            } catch (e) {
                return freshData;
            }
        }

        function generateDefaultData() {
            const names = ["黃琨翔", "陳秉軒", "杜晨翔", "劉景碩", "王宇童", "吳立翔", "陳宇恩", "林楷諾", "李柏衡", "林晉翰", "徐堉綸", "紀孟希", "徐晟瀚", "王知言", "蔡沛穎", "鄭詠心", "郭聿芸", "楊茲甯", "王岑芝", "吳涵儒", "洪楀晴", "林芷萱", "潘若穎", "焉語霓", "蘇唯心"];
            const ids = ["113056", "113058", "113164", "113166", "113245", "113140", "113248", "113010", "113037", "113279", "113123", "113200", "113015", "113017", "113151", "113284", "113178", "113204", "113021", "113205", "113232", "113208", "113129", "113134", "113212"];
            let students = {};
            ids.forEach((id, index) => {
                students[id] = { name: names[index], seat: String(index + 1), homeworkStatus: {}, parentAssist: "", injuries: [] };
            });
            students["123"] = { name: "測試帳號", seat: "30", homeworkStatus: {}, parentAssist: "", injuries: [] };

            const defaultId = new Date().toISOString();
            const defaultNotesList = [{
                id: defaultId,
                date: "民國 115 年 11 月 19 日 (星期四)",
                content: "1. 國文習作第 4 課完成\n2. 數學隨堂練習卷",
                parentMessage: "請準時完成作業。",
                reminder: "帶水壺。"
            }];

            return { students: students, classInfo: { schoolName: "崇明國小", className: "三年九班", teacherName: "陽芯妮" }, notesList: defaultNotesList, activeNoteId: defaultId };
        }

        async function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            btn.innerText = "正在抓取最新資料...";
            await syncLoadData(true);
            btn.innerText = "進入專屬小天地 🧸";

            const studentId = document.getElementById('login-student-id').value.trim();
            const rememberMe = document.getElementById('parent-remember-me').checked;
            const systemData = getSystemData();

            if (systemData.students[studentId]) {
                if (rememberMe) {
                    localStorage.setItem('ncm309_remembered_parent_id', studentId);
                } else {
                    localStorage.removeItem('ncm309_remembered_parent_id');
                }
                autoLoginParent(studentId, systemData);
            } else {
                alert("找不到此學號！請確認輸入是否正確。");
            }
        }

        function autoLoginParent(studentId, systemData) {
            currentStudentId = studentId;
            sessionStorage.setItem('ncm309_logged_student', studentId);

            const student = systemData.students[studentId];
            const cInfo = systemData.classInfo || { schoolName: "崇明國小", className: "三年九班", teacherName: "老師" };

            document.getElementById('header-child-name').innerText = student.name;
            document.getElementById('header-className-display').innerText = `${cInfo.className} • 座號 ${student.seat} 號`;
            document.getElementById('note-teacher-label').innerHTML = `<i class="fa-solid fa-heart text-rose-500"></i> ${cInfo.teacherName}老師提醒 / 給家長的話：`;

            renderDashboard(student, systemData);

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        }

        function renderDashboard(student, systemData) {
            sortNotesByDate(systemData.notesList);
            // 當前顯示的聯絡簿
            let activeNote = systemData.notesList.find(n => n.id === systemData.activeNoteId) || systemData.notesList[0] || null;
            // 昨天的聯絡簿（依日期排序後的下一篇；若只有一篇則對應同一篇）
            let activeNoteIndex = systemData.notesList.findIndex(n => n.id === (activeNote ? activeNote.id : ''));
            let yesterdayNote = (activeNoteIndex !== -1 && systemData.notesList[activeNoteIndex + 1]) ? systemData.notesList[activeNoteIndex + 1] : activeNote;

            if (activeNote) {
                document.getElementById('note-display-date').innerText = activeNote.date;
                document.getElementById('note-display-content').innerText = activeNote.content;
                document.getElementById('note-display-message').innerText = activeNote.parentMessage || "尚無留言";
                document.getElementById('note-display-reminder').innerText = activeNote.reminder || "無";
            } else {
                document.getElementById('note-display-date').innerText = "無日期";
                document.getElementById('note-display-content').innerText = "目前尚無當天聯絡簿";
                document.getElementById('note-display-message').innerText = "尚無留言";
                document.getElementById('note-display-reminder').innerText = "無";
            }

            const statusMap = {
                "1": { text: "繳交", color: "bg-[#C8E6C9] text-[#1B5E20] border-[#A5D6A7]" },
                "2": { text: "已補交", color: "bg-[#BBDEFB] text-[#0D47A1] border-[#90CAF9]" },
                "3": { text: "未完成", color: "bg-[#FFE082] text-[#5D4037] border-[#FFD54F]" },
                "4": { text: "需訂正、補交", color: "bg-[#FFCDD2] text-[#B71C1C] border-[#EF9A9A]" },
                "5": { text: "未帶回家", color: "bg-[#E1BEE7] text-[#4A148C] border-[#CE93D8]" },
                "6": { text: "未帶到學校", color: "bg-[#FFE0B2] text-[#E65100] border-[#FFCC80]" }
            };

            const yesterdayHwContainer = document.getElementById('yesterday-homework-list');
            yesterdayHwContainer.innerHTML = '';
            
            if (yesterdayNote && yesterdayNote.content) {
                document.getElementById('yesterday-date-label').innerText = `對應聯絡簿：${yesterdayNote.date}`;
                const yestHwLines = yesterdayNote.content.split('\n').filter(line => line.trim() !== '');
                const yestStudentStatus = (student.homeworkStatus && student.homeworkStatus[yesterdayNote.id]) || {};

                if (yestHwLines.length === 0) {
                    yesterdayHwContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">昨日無作業登記</p>`;
                } else {
                    yestHwLines.forEach((line, idx) => {
                        const statusKey = yestStudentStatus[idx] || "1";
                        const s = statusMap[statusKey] || statusMap["1"];
                        yesterdayHwContainer.innerHTML += `
                            <div class="flex items-center justify-between gap-2 p-3 rounded-xl bg-[#F0F7F6] border border-[#A3D2CA] text-xs">
                                <span class="font-bold text-[#2F4F4F] break-words">${line}</span>
                                <span class="px-3 py-1 rounded-full font-bold border ${s.color} text-[11px] whitespace-nowrap shrink-0">${s.text}</span>
                            </div>
                        `;
                    });
                }
            } else {
                yesterdayHwContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">昨日無作業狀態追蹤</p>`;
            }

            const parentAssistContainer = document.getElementById('parent-assist-homework-list');
            parentAssistContainer.innerHTML = '';
            
            if (student.parentAssist && student.parentAssist.trim() !== '') {
                parentAssistContainer.innerHTML = `
                    <div class="p-3.5 bg-[#FFF9C4] rounded-xl border border-[#FFE082] text-xs space-y-1">
                        <span class="font-bold text-[#5D4037]"><i class="fa-solid fa-hands-holding-child mr-1"></i> 老師給家長的個別協助事項：</span>
                        <p class="text-[#3E2723] whitespace-pre-line mt-1 pl-3 font-medium">${student.parentAssist}</p>
                    </div>
                `;
            } else {
                parentAssistContainer.innerHTML = `<p class="text-slate-500 text-center py-1 font-medium">目前無特別需家長協助之項目 ✨</p>`;
            }

            const historyNotesContainer = document.getElementById('all-history-notes-container');
            historyNotesContainer.innerHTML = '';
            if (systemData.notesList.length === 0) {
                historyNotesContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">尚無歷史聯絡簿紀錄</p>`;
            } else {
                systemData.notesList.forEach(note => {
                    const isCurrent = note.id === systemData.activeNoteId;
                    historyNotesContainer.innerHTML += `
                        <div class="p-3.5 ${isCurrent ? 'bg-[#D8E8E5] border-[#598379]' : 'bg-[#F0F7F6] border-[#A3D2CA]'} rounded-xl border text-xs space-y-1">
                            <p class="font-bold text-[#2F4F4F] flex justify-between items-center">
                                <span><i class="fa-solid fa-calendar-days mr-1 text-[#598379]"></i> ${note.date}</span>
                                ${isCurrent ? '<span class="text-[10px] bg-[#598379] text-white px-2 py-0.5 rounded-full">當前顯示中</span>' : ''}
                            </p>
                            <p class="text-slate-800 whitespace-pre-line font-medium">${note.content}</p>
                            ${note.parentMessage ? `<p class="text-[#2F4F4F] bg-[#E0F2F1] p-2 rounded-lg mt-1 font-medium">老師的話：${note.parentMessage}</p>` : ''}
                            ${note.reminder ? `<p class="text-[#00897B] bg-[#E0F2F1] p-2 rounded-lg mt-1 font-medium">叮嚀備註：${note.reminder}</p>` : ''}
                        </div>
                    `;
                });
            }

            const pendingContainer = document.getElementById('pending-injury-list');
            const confirmedContainer = document.getElementById('confirmed-injury-list');
            pendingContainer.innerHTML = '';
            confirmedContainer.innerHTML = '';

            let pendingCount = 0;
            let confirmedCount = 0;

            if (!student.injuries || student.injuries.length === 0) {
                pendingContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">目前無待確認的傷病通知 🌸</p>`;
                confirmedContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">尚無已確認的傷病紀錄檔案</p>`;
            } else {
                student.injuries.forEach((inj, index) => {
                    const isConfirmed = inj.confirmed === true;
                    const htmlCard = `
                        <div class="p-3.5 rounded-xl ${isConfirmed ? 'bg-[#E8F5E9] border-[#A5D6A7]' : 'bg-[#FFEBEE] border-[#EF9A9A]'} border text-xs space-y-1.5 shadow-sm">
                            <div class="flex justify-between items-center font-bold">
                                <span class="${isConfirmed ? 'text-[#2E7D32]' : 'text-[#C62828]'}">${inj.date} ${inj.time}</span>
                                <span class="text-[#598379]">處理：${inj.nurse}</span>
                            </div>
                            <div>
                                <p class="font-bold text-slate-900">狀況：${inj.symptom}</p>
                                <p class="text-slate-700 mt-0.5">地點：${inj.location}</p>
                            </div>
                            <div class="bg-white p-2.5 rounded-lg border ${isConfirmed ? 'border-[#C8E6C9]' : 'border-[#FFCDD2]'} text-slate-800 font-medium">
                                <p class="font-bold ${isConfirmed ? 'text-[#2E7D32]' : 'text-[#C62828]'}">處理經過：</p>
                                <p class="mt-0.5">${inj.treatment}</p>
                            </div>
                            <div class="pt-2 border-t ${isConfirmed ? 'border-[#C8E6C9]' : 'border-[#FFCDD2]'} flex justify-between items-center">
                                <span class="text-[11px] ${isConfirmed ? 'text-emerald-700 font-bold' : 'text-amber-800 font-bold'}">
                                    <i class="fa-solid ${isConfirmed ? 'fa-circle-check' : 'fa-clock'} mr-1"></i>
                                    ${isConfirmed ? '已於 ' + inj.confirmTime + ' 確認收到' : '等待家長確認'}
                                </span>
                                ${!isConfirmed ? `
                                    <button onclick="confirmInjury(${index})" class="bg-[#598379] hover:bg-[#4A6B63] text-white font-bold px-3 py-1.5 rounded-lg shadow-sm transition text-[11px] active:scale-95">
                                        確認已收到 💛
                                    </button>
                                ` : `
                                    <span class="bg-[#C8E6C9] text-[#1B5E20] px-2.5 py-1 rounded-lg font-bold text-[11px]">已完成確認 ✓</span>
                                `}
                            </div>
                        </div>
                    `;

                    if (isConfirmed) {
                        confirmedCount++;
                        confirmedContainer.innerHTML += htmlCard;
                    } else {
                        pendingCount++;
                        pendingContainer.innerHTML += htmlCard;
                    }
                });

                if (pendingCount === 0) {
                    pendingContainer.innerHTML = `<p class="text-center text-xs text-[#598379] font-bold py-2">太棒了！所有傷病通知皆已確認完畢 ✨</p>`;
                }
                if (confirmedCount === 0) {
                    confirmedContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-2">尚無已確認的傷病紀錄</p>`;
                }
            }

            document.getElementById('pending-injury-count').innerText = pendingCount;
            document.getElementById('confirmed-injury-count').innerText = confirmedCount;
        }

        async function confirmInjury(injuryIndex) {
            await syncLoadData(false);
            const systemData = getSystemData();
            const now = new Date();
            const timeString = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            systemData.students[currentStudentId].injuries[injuryIndex].confirmed = true;
            systemData.students[currentStudentId].injuries[injuryIndex].confirmTime = timeString;
            
            localStorage.setItem('ncm309_school_data', JSON.stringify(systemData));
            try {
                await fetch(CLOUD_BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                    body: JSON.stringify(systemData)
                });
            } catch(e) {}

            alert("已成功回報學校：確認收到傷病通知！");
            renderDashboard(systemData.students[currentStudentId], systemData);
        }

        function switchTab(tab) {
            document.getElementById('tab-today').className = tab === 'today' ? "flex-1 py-2 font-bold rounded-lg bg-white text-[#2F4F4F] shadow-sm transition active:scale-95" : "flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95";
            document.getElementById('tab-history').className = tab === 'history' ? "flex-1 py-2 font-bold rounded-lg bg-white text-[#2F4F4F] shadow-sm transition active:scale-95" : "flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95";
            document.getElementById('tab-injury').className = tab === 'injury' ? "flex-1 py-2 font-bold rounded-lg bg-white text-[#2F4F4F] shadow-sm transition active:scale-95" : "flex-1 py-2 font-bold rounded-lg text-[#598379] transition active:scale-95";

            document.getElementById('view-today').classList.toggle('hidden', tab !== 'today');
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('view-injury').classList.toggle('hidden', tab !== 'injury');
        }

        function logout() {
            currentStudentId = null;
            sessionStorage.removeItem('ncm309_logged_student');
            document.getElementById('login-student-id').value = localStorage.getItem('ncm309_remembered_parent_id') || '';
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    </script>
</body>
</html>
